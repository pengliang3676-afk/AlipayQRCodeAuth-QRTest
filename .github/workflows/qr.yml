name: QR Version Test

on:
  push:
    paths:
      - 'qr/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: gcc -O1 -g -fsanitize=address -o qr_ver_test qr/qr_ver_test.c

      - name: Run
        run: ASAN_OPTIONS=detect_leaks=0 ./qr_ver_test

      - name: Decode all versions with zxing-cpp
        run: |
          pip install numpy zxing-cpp pillow
          python3 qr/zxing_check.py
